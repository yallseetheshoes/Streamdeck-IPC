<!DOCTYPE html>
<html>

<head lang="en">
    <title>Pipe emitter settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
<!--
    Learn more about property inspector components at https://sdpi-components.dev/docs/components
-->
<sdpi-item label="Channel">
    <sdpi-textarea
            setting="channel"
            rows="1"
    >
    </sdpi-textarea>
</sdpi-item>
<sdpi-item label="Payload">
    <sdpi-textarea
            setting="payload"
            rows="5"
    >
    </sdpi-textarea>
</sdpi-item>
<sdpi-item label="Errors">
    <div id="error-display" style="color: #ff4545;">

    </div>
</sdpi-item>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        SDPIComponents.streamDeckClient.sendToPropertyInspector.subscribe((msg) => {
            document.getElementById("error-display").innerText = `IPC failure: ${msg.payload.msg}`;
        });
    });
</script>

</body>

</html>
